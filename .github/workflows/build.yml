name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mingw-cross:
    name: MinGW cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Cross-compile
        run: bash scripts/build-linux.sh

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpleDrawingApp-mingw
          path: build-linux/SimpleDrawingApp.exe
          if-no-files-found: error
